<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bags — Soft Luxe Edit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">Soft Luxe <span>Edit</span></a>
      <button class="nav-toggle" aria-label="Menu" onclick="document.querySelector('.nav').classList.toggle('open')">☰</button>
      <nav class="nav">
        <a href="../index.html">Home</a>
        <a href="bags.html">Bags</a>
        <a href="shoes.html">Shoes</a>
        <a href="../archive.html">Archive</a>
        <a href="../about.html">About</a>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <h1 class="section-title">Bags</h1>
      <p class="text-center" style="color:var(--muted);max-width:480px;margin:-1rem auto 2.5rem;">Shoulder bags, totes, hobos, vanity cases and more — all with direct DHgate links.</p>
      <div class="product-grid" id="grid"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <nav class="footer-nav">
        <a href="../index.html">Home</a>
        <a href="bags.html">Bags</a>
        <a href="shoes.html">Shoes</a>
        <a href="../archive.html">Archive</a>
        <a href="../about.html">About</a>
      </nav>
      <p>© 2025–2026 Soft Luxe Edit.</p>
    </div>
  </footer>

  <script>
    fetch('../data/products.json')
      .then(r => r.json())
      .then(products => {
        const bags = products.filter(p => p.category === 'bags').sort((a,b) => new Date(b.published) - new Date(a.published));
        document.getElementById('grid').innerHTML = bags.map(p => `
          <a href="../reviews/${p.slug}.html" class="product-card">
            <div class="img-wrap">
              ${p.images && p.images[0] ? `<img src="${p.images[0]}" alt="${p.name}" loading="lazy">` : '<div style="background:var(--warm-beige);height:100%;"></div>'}
            </div>
            <div class="info">
              <div class="category">${p.subcategory || 'bag'}</div>
              <h3>${p.name}</h3>
              <div class="meta">
                <span>${p.price || ''}</span>
                <span class="badge badge-${p.status}">${p.status}</span>
              </div>
            </div>
          </a>
        `).join('');
      });
  </script>
</body>
</html>
