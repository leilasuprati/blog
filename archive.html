<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Archive — Soft Luxe Edit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Soft Luxe <span>Edit</span></a>
      <button class="nav-toggle" aria-label="Menu" onclick="document.querySelector('.nav').classList.toggle('open')">☰</button>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="categories/bags.html">Bags</a>
        <a href="categories/shoes.html">Shoes</a>
        <a href="archive.html">Archive</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <h1 class="section-title">Review Archive</h1>
      <p class="text-center" style="color:var(--muted);max-width:520px;margin:-1rem auto 2.5rem;">A full year of finds, organized by date. Published reviews include photos and notes. Drafts are clearly marked.</p>

      <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="bags">Bags</button>
        <button class="filter-btn" data-filter="shoes">Shoes</button>
        <button class="filter-btn" data-filter="published">Published</button>
        <button class="filter-btn" data-filter="draft">Drafts</button>
      </div>

      <div class="product-grid" id="archive-grid">
        <!-- Populated by JS -->
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <nav class="footer-nav">
        <a href="index.html">Home</a>
        <a href="categories/bags.html">Bags</a>
        <a href="categories/shoes.html">Shoes</a>
        <a href="archive.html">Archive</a>
        <a href="about.html">About</a>
      </nav>
      <p>© 2025–2026 Soft Luxe Edit.</p>
    </div>
  </footer>

  <script>
    let allProducts = [];
    fetch('data/products.json')
      .then(r => r.json())
      .then(products => {
        allProducts = products.sort((a,b) => new Date(b.published) - new Date(a.published));
        render(allProducts);
      });

    function render(list) {
      const grid = document.getElementById('archive-grid');
      grid.innerHTML = list.map(p => `
        <a href="reviews/${p.slug}.html" class="product-card" data-category="${p.category}" data-status="${p.status}">
          <div class="img-wrap">
            ${p.images && p.images[0] ? `<img src="${p.images[0]}" alt="${p.name}" loading="lazy">` : '<div style="background:var(--warm-beige);height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);">No photo yet</div>'}
          </div>
          <div class="info">
            <div class="category">${p.category} · ${p.published}</div>
            <h3>${p.name}</h3>
            <div class="meta">
              <span>${p.price || ''}</span>
              <span class="badge badge-${p.status}">${p.status}</span>
            </div>
          </div>
        </a>
      `).join('');
    }

    document.getElementById('filters').addEventListener('click', e => {
      if (!e.target.classList.contains('filter-btn')) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      const f = e.target.dataset.filter;
      if (f === 'all') render(allProducts);
      else if (f === 'published' || f === 'draft') render(allProducts.filter(p => p.status === f));
      else render(allProducts.filter(p => p.category === f));
    });
  </script>
</body>
</html>
